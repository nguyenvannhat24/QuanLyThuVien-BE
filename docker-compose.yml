version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: library_mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - library_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: library_phpmyadmin
    ports:
      - '8082:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: library_user
      PMA_PASSWORD: library_pass
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - library_network

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
      - ~/.m2:/root/.m2
    container_name: library_spring_app
    ports:
      - '8081:8081'
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library_pass
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - library_network

volumes:
  mysql_data:

networks:
  library_network:
    driver: bridge
