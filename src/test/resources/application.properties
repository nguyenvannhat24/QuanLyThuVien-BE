# H2 In-Memory Database Configuration for Tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Explicitly override Hibernate dialect (in case it's set elsewhere)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable MongoDB auto-configuration for tests (this is a JPA-only test)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Cache Configuration - Use simple cache for tests
spring.cache.type=simple

# JWT Configuration - Dummy values for tests
jwt.secret=test-secret-key-for-integration-tests-minimum-256-bits-long
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
